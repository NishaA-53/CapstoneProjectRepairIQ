
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairIQ - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93b4f5;
            cursor: wait;
        }

        .login, .home {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .home a {
            color: #555;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
<div class="register-container">
    <div class="logo">RepairIQ</div>
    <h2>Create Account</h2>

    <form id="registerForm" onsubmit="registerUser(event)">
        <label for="name">Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               placeholder="Create a password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Confirm your password" required>

        <button type="submit" id="registerButton">
            Create Account
        </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <div class="home">
        <a href="index.html">← Back to Home</a>
    </div>
</div>

<script>
const API_URL = "https://repairiq-backend.onrender.com/api/users";

async function registerUser(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.color = "red";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";
    message.textContent = "Connecting to RepairIQ backend...";
    message.style.color = "#2563eb";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })
        });

        const data = (await response.text()).trim();

        if (!response.ok) {
            throw new Error("Server error " + response.status + ": " + data);
        }

        if (data === "Registration successful") {
            message.textContent = "Registration successful! Opening login...";
            message.style.color = "green";

            document.getElementById("registerForm").reset();

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);
        } else {
            message.textContent = data || "Registration failed.";
            message.style.color = "red";
        }
    } catch (error) {
        console.error("Registration error:", error);
        message.textContent =
            "Could not connect to the local backend. " + error.message;
        message.style.color = "red";
    } finally {
        button.disabled = false;
        button.textContent = "Create Account";
    }
}
</script>
</body>
</html>
