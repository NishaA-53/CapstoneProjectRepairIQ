
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairIQ - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93b4f5;
            cursor: wait;
        }

        #otpForm {
            display: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .register,
        .home {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .home a {
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-container">

        <div class="logo">RepairIQ</div>
        <h2>Welcome Back</h2>

        <!-- Login form -->
        <form id="loginForm">
            <div id="loginSection">

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">
                    Login
                </button>

            </div>
        </form>

        <!-- Separate OTP form -->
        <form id="otpForm">
            <div id="otpSection">

                <label for="otp">Enter OTP</label>
                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    required
                >

                <button type="submit" id="verifyButton">
                    Verify OTP
                </button>

                <button
                    type="button"
                    id="backButton"
                    style="margin-top: 10px; background: #64748b;"
                >
                    Back to Login
                </button>

            </div>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <div class="home">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script>
        "use strict";
         const API = "https://repairiq-backend.onrender.com/api/users";

        let loginEmail = "";

        const loginForm = document.getElementById("loginForm");
        const otpForm = document.getElementById("otpForm");

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const otpInput = document.getElementById("otp");

        const loginSection = document.getElementById("loginSection");
        const otpSection = document.getElementById("otpSection");

        const loginButton = document.getElementById("loginButton");
        const verifyButton = document.getElementById("verifyButton");
        const backButton = document.getElementById("backButton");

        const message = document.getElementById("message");

        function showMessage(text, color = "red") {
            message.textContent = text;
            message.style.color = color;
        }

        // Login and request an OTP
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            loginEmail = emailInput.value.trim();

            loginButton.disabled = true;
            loginButton.textContent = "Checking...";

            showMessage("Checking your login details...", "#2563eb");

            try {
                const response = await fetch(`${API}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: loginEmail,
                        password: passwordInput.value
                    })
                });

                const data = (await response.text()).trim();

                if (!response.ok) {
                    throw new Error(
                        `Server error ${response.status}: ${data}`
                    );
                }

                if (data === "OTP sent") {
                    loginSection.style.display = "none";
                    otpForm.style.display = "block";
                    otpSection.style.display = "block";

                    showMessage(
                        "OTP sent. Check your email inbox and spam folder.",
                        "green"
                    );

                    otpInput.focus();

                } else if (data === "Unable to send OTP") {
                    showMessage(
                        "Your login details were accepted, but OTP email delivery failed. Please check the backend email configuration.",
                        "red"
                    );

                } else {
                    showMessage(data, "red");
                }

            } catch (error) {
                console.error("Login error:", error);

                showMessage(
                    "Login request failed: " + error.message +
                    ". Make sure Spring Boot is running on localhost:8080.",
                    "red"
                );

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });

        // Verify the OTP
        otpForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const otp = otpInput.value.trim();

            if (!/^[0-9]{6}$/.test(otp)) {
                showMessage("Enter the complete 6-digit OTP.", "red");
                return;
            }

            verifyButton.disabled = true;
            verifyButton.textContent = "Verifying...";

            showMessage("Verifying OTP...", "#2563eb");

            try {
                const response = await fetch(`${API}/verify-otp`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: loginEmail,
                        otp: otp
                    })
                });

                const data = (await response.text()).trim();

                if (!response.ok) {
                    throw new Error(
                        `Server error ${response.status}: ${data}`
                    );
                }

                if (data === "OTP verified") {
                    showMessage(
                        "Login successful! Opening dashboard...",
                        "green"
                    );

                    window.setTimeout(function () {
                        window.location.href = "dashboard.html";
                    }, 1000);

                } else {
                    showMessage(data, "red");
                }

            } catch (error) {
                console.error("OTP verification error:", error);

                showMessage(
                    "OTP verification failed: " + error.message,
                    "red"
                );

            } finally {
                verifyButton.disabled = false;
                verifyButton.textContent = "Verify OTP";
            }
        });

        // Return to the login form
        backButton.addEventListener("click", function () {
            otpForm.style.display = "none";
            otpSection.style.display = "none";

            loginSection.style.display = "block";

            otpInput.value = "";
            passwordInput.value = "";

            showMessage("", "");
        });
    </script>
</body>
</html>
