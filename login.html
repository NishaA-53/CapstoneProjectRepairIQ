<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RepairIQ - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93b4f5;
            cursor: not-allowed;
        }

        #otpSection {
            display: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            text-align: center;
            margin-top: 15px;
        }

        .home a {
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">RepairIQ</div>

    <h2>Welcome Back</h2>

    <form onsubmit="loginUser(event)">

        <div id="loginSection">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

        </div>

        <div id="otpSection">

            <label for="otp">Enter OTP</label>

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                inputmode="numeric"
            >

            <button type="button" id="verifyButton" onclick="verifyOtp()">
                Verify OTP
            </button>

        </div>

    </form>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

    <div class="home">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

let loginEmail = "";

function loginUser(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginEmail = email;

    message.innerHTML = "Checking login...";
    message.style.color = "#2563eb";

    loginButton.disabled = true;
    loginButton.innerHTML = "Sending OTP...";

    fetch("http://localhost:8080/api/users/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: email,
            password: password
        })

    })

    .then(async response => {

        const data = await response.text();

        if (!response.ok) {
            throw new Error(data || "Server error");
        }

        return data;
    })

    .then(data => {

        if (data.trim() === "OTP sent") {

            message.innerHTML =
                "✅ OTP sent to your email.<br>Check your inbox.";

            message.style.color = "green";

            document.getElementById("loginSection").style.display = "none";
            document.getElementById("otpSection").style.display = "block";

        } else {

            message.innerHTML = "❌ " + data;
            message.style.color = "red";

            loginButton.disabled = false;
            loginButton.innerHTML = "Login";
        }

    })

    .catch(error => {

        console.error("Login Error:", error);

        message.innerHTML =
            "❌ Login failed.<br>" +
            "Please check that the backend is running.";

        message.style.color = "red";

        loginButton.disabled = false;
        loginButton.innerHTML = "Login";
    });
}


function verifyOtp() {

    const otp = document.getElementById("otp").value.trim();

    const message = document.getElementById("message");
    const verifyButton = document.getElementById("verifyButton");

    if (otp.length !== 6) {

        message.innerHTML = "❌ Please enter the 6-digit OTP.";
        message.style.color = "red";

        return;
    }

    message.innerHTML = "Verifying OTP...";
    message.style.color = "#2563eb";

    verifyButton.disabled = true;
    verifyButton.innerHTML = "Verifying...";

    fetch("http://localhost:8080/api/users/verify-otp", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: loginEmail,
            otp: otp
        })

    })

    .then(async response => {

        const data = await response.text();

        if (!response.ok) {
            throw new Error(data || "Server error");
        }

        return data;
    })

    .then(data => {

        if (data.trim() === "OTP verified") {

            message.innerHTML = "✅ Login successful!";
            message.style.color = "green";

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);

        } else {

            message.innerHTML = "❌ " + data;
            message.style.color = "red";

            verifyButton.disabled = false;
            verifyButton.innerHTML = "Verify OTP";
        }

    })

    .catch(error => {

        console.error("OTP Error:", error);

        message.innerHTML =
            "❌ OTP verification failed.";

        message.style.color = "red";

        verifyButton.disabled = false;
        verifyButton.innerHTML = "Verify OTP";
    });
}

</script>

</body>
</html>
