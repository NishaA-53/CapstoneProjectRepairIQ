<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RepairIQ - Repairability Assessment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93b4f5;
            cursor: not-allowed;
        }

        #result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            display: none;
            background: #f0fdf4;
        }

        #score {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
        }

        #message {
            margin-top: 12px;
            color: #444;
            line-height: 1.5;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>RepairIQ</h1>
    <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

    <h2>Repairability Assessment</h2>

    <p class="description">
        Evaluate how easy and economical it is to repair your product.
    </p>

    <form onsubmit="assessRepairability(event)">

        <label for="product">Product Name</label>

        <input
            type="text"
            id="product"
            placeholder="Enter product name"
            required
        >

        <label for="age">Product Age</label>

        <select id="age" required>
            <option value="">Select</option>
            <option value="3">Less than 2 years</option>
            <option value="2">2 - 5 years</option>
            <option value="1">More than 5 years</option>
        </select>

        <label for="parts">Spare Parts Availability</label>

        <select id="parts" required>
            <option value="">Select</option>
            <option value="3">Easily Available</option>
            <option value="2">Available with Difficulty</option>
            <option value="1">Not Easily Available</option>
        </select>

        <label for="disassembly">Ease of Disassembly</label>

        <select id="disassembly" required>
            <option value="">Select</option>
            <option value="3">Easy</option>
            <option value="2">Moderate</option>
            <option value="1">Difficult</option>
        </select>

        <label for="cost">Repair Cost</label>

        <select id="cost" required>
            <option value="">Select</option>
            <option value="3">Low Cost</option>
            <option value="2">Moderate Cost</option>
            <option value="1">High Cost</option>
        </select>

        <button type="submit" id="assessButton">
            Assess Repairability
        </button>

    </form>

    <div id="result">

        <div>Repairability Score</div>

        <div id="score">0/100</div>

        <div id="status"></div>

        <p id="message"></p>

    </div>

    <div class="back">
        <a href="dashboard.html">← Back to Dashboard</a>
    </div>

</div>

<script>

function assessRepairability(event) {

    event.preventDefault();

    const product = document.getElementById("product").value.trim();

    const age = Number(document.getElementById("age").value);

    const parts = Number(document.getElementById("parts").value);

    const disassembly =
        Number(document.getElementById("disassembly").value);

    const cost =
        Number(document.getElementById("cost").value);

    const total =
        age + parts + disassembly + cost;

    const repairabilityScore =
        Math.round((total / 12) * 100);

    let status;
    let message;

    if (repairabilityScore >= 75) {

        status = "🟢 Highly Repairable";

        message =
            "This product can be repaired easily and economically.";

    } else if (repairabilityScore >= 50) {

        status = "🟡 Moderately Repairable";

        message =
            "This product can be repaired, but some factors may increase the difficulty or cost.";

    } else {

        status = "🔴 Difficult to Repair";

        message =
            "Repair may be difficult or expensive. Replacement may be considered.";
    }

    const productData = {

        productName: product,

        age: age,

        spareParts: parts,

        disassembly: disassembly,

        repairCost: cost,

        repairabilityScore: repairabilityScore
    };

    const button =
        document.getElementById("assessButton");

    button.disabled = true;

    button.innerHTML = "Saving Assessment...";

    fetch("http://localhost:8080/api/products", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(productData)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Server returned an error"
            );
        }

        return response.json();

    })

    .then(data => {

        document.getElementById("score").innerHTML =
            repairabilityScore + "/100";

        document.getElementById("status").innerHTML =
            status;

        document.getElementById("message").innerHTML =
            message +
            "<br><br>✅ Assessment saved successfully.";

        document.getElementById("result").style.display =
            "block";

        button.disabled = false;

        button.innerHTML =
            "Assess Repairability";

    })

    .catch(error => {

        console.error(
            "Repairability Error:",
            error
        );

        document.getElementById("score").innerHTML =
            repairabilityScore + "/100";

        document.getElementById("status").innerHTML =
            status;

        document.getElementById("message").innerHTML =
            message +
            "<br><br>❌ Assessment could not be saved.";

        document.getElementById("result").style.display =
            "block";

        button.disabled = false;

        button.innerHTML =
            "Assess Repairability";
    });
}

</script>

</body>
</html>
